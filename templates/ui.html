<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Customer Segmentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 28rem;
        }
        h1 {
            color: #1f2937;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
        }
        label {
            display: block;
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 0.5rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
            transition: border-color 0.2s ease-in-out;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #3b82f6;
            color: #ffffff;
            font-weight: 600;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        button:hover {
            background-color: #2563eb;
        }
        .result-section {
            margin-top: 1.5rem;
            text-align: center;
        }
        #result {
            font-size: 1.25rem;
            font-weight: bold;
            color: #1f2937;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hotel Customer Segmentation</h1>
        <form id="predictionForm" class="space-y-4">
            <div>
                <label for="adults">Adults:</label>
                <input type="number" id="adults" name="adults" value="2" required />
            </div>
            <div>
                <label for="children">Children:</label>
                <input type="number" id="children" name="children" value="0" required />
            </div>
            <div>
                <label for="lead_time">Lead Time (days):</label>
                <input type="number" id="lead_time" name="lead_time" value="30" required />
            </div>
            <div>
                <label for="adr">Average Daily Rate (ADR):</label>
                <input type="number" step="0.01" id="adr" name="adr" value="100.0" required />
            </div>
            <div>
                <label for="total_nights">Total Nights:</label>
                <input type="number" id="total_nights" name="total_nights" value="3" required />
            </div>
            <div>
                <label for="total_of_special_requests">Total Special Requests:</label>
                <input type="number" id="total_of_special_requests" name="total_of_special_requests" value="0" required />
            </div>
            
            <button type="submit">Predict Cluster</button>
        </form>
        <div class="result-section">
            <h2>Result:</h2>
            <p id="result"></p>
        </div>
    </div>
    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('result').innerText = 'Predicting...';

            const data = {
                adults: parseInt(document.getElementById('adults').value),
                children: parseInt(document.getElementById('children').value),
                lead_time: parseInt(document.getElementById('lead_time').value),
                adr: parseFloat(document.getElementById('adr').value),
                total_nights: parseInt(document.getElementById('total_nights').value),
                total_of_special_requests: parseInt(document.getElementById('total_of_special_requests').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    document.getElementById('result').innerText = `Assigned Cluster: ${result.assigned_cluster}`;
                } else {
                    document.getElementById('result').innerText = `Error: ${result.message}`;
                }
            } catch (error) {
                document.getElementById('result').innerText = `Fetch error: ${error}`;
            }
        });
    </script>
</body>
</html>
